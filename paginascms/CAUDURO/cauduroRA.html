<script>
const toggleBtnBottom = document.getElementById("toggleBtnBottom");
const footerMenu = document.getElementById("menunavfooter");
const overlayBottom = document.getElementById("menuOverlayBottom");

toggleBtnBottom.addEventListener("click", () => {
  footerMenu.classList.toggle("active");
  overlayBottom.classList.toggle("active");
});

// Fecha ao clicar no overlay
overlayBottom.addEventListener("click", () => {
  footerMenu.classList.remove("active");
  overlayBottom.classList.remove("active");
});
</script>
