  <!-- model-viewer para renderizar GLB -->

  <style>
    html, body { height: 100%; margin: 0; background: #000; }
    /* palco full screen — canvas + overlay 3D empilhados */
    #stage {
      position: fixed;
      inset: 0;            /* top:0; right:0; bottom:0; left:0; */
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      touch-action: none;
      background: #000;
    }

    /* garantir que o canvas p5 ocupe a tela inteira */
    .p5Canvas {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover; /* preenche a tela sem deixar bordas pretas */
    }

    /* overlay 3D (o modelo que "fica na palma") */
    #palma3d {
      position: absolute;
      transform: translate(-50%, -50%); /* centra o elemento em left/top */
      pointer-events: none;   /* permite interagir com a página "atrás" se quiser */
      z-index: 9999;
      background: transparent;
      display: none; /* escondido até a detecção */
      will-change: transform, left, top, width, height;
    }
    /* tornar o model-viewer com fundo transparente explicitamente */
    model-viewer { background: transparent; }
  </style>
</head>
<body>
     <div id="menunavtop">

<button id="switchCameraBtn" style="
  position: fixed;
  bottom: 100px;
  right: 20px;
  z-index: 10000;
  padding: 10px 16px;
  border: none;
  border-radius: 8px;
  background: #fff;
  cursor: pointer;
">
Trocar Câmera
</button>


  <div id="stage"></div>

  <!-- overlay 3D: fica posicionado dinamicamente via JS -->
<model-viewer id="palma3d"
  src="../../assets/3d/jantzen.glb"
  exposure="1"
  camera-controls
  interaction-prompt="none"
  disable-zoom
  shadow-intensity="0"
  reveal="auto">
</model-viewer>

<script>
  // Detector + previsões
  let detectorModel = null;
  let predictions = [];

  // p5 elements
  let canvas, capture, ctx;

  // referência DOM do model-viewer
  const mv = document.getElementById('palma3d');

  // Ajuste: se quiser ver o espelho (efeito selfie), deixe true.
  const USE_MIRROR = true;

  const settings = {
    flipHorizontal: USE_MIRROR,
    maxNumBoxes: 10,
    iouThreshold: 0.5,
    scoreThreshold: 0.6
  };

  let currentFacingMode = "user"; // começa com câmera frontal

  // loop de detecção (não desenha caixas — evita poluir o canvas)
  function runDetectionLoop() {
    if (!capture || !detectorModel) return;
    detectorModel.detect(capture.elt).then(preds => {
      predictions = preds;
      requestAnimationFrame(runDetectionLoop);
    }).catch(err => {
      console.warn('handtrack detect error:', err);
      requestAnimationFrame(runDetectionLoop);
    });
  }

  function setup() {
    canvas = createCanvas(windowWidth, windowHeight);
    canvas.parent('stage');

    startCapture();

    ctx = canvas.elt.getContext('2d');
    imageMode(CORNER);
    noStroke();
    fill(255);

    // botão de troca
    document.getElementById("switchCameraBtn").addEventListener("click", switchCamera);
  }

  function startCapture() {
    if (capture) {
      capture.remove(); // remove vídeo anterior
    }

    capture = createCapture({
      video: { facingMode: currentFacingMode }
    }, () => {
      handTrack.load(settings).then(m => {
        detectorModel = m;
        runDetectionLoop();
      });
    });

    capture.size(windowWidth, windowHeight);
    capture.hide();
  }

  function switchCamera() {
    currentFacingMode = (currentFacingMode === "user") ? "environment" : "user";
    startCapture();
  }

  function draw() {
    if (!capture) return;

    // vídeo espelhado ou não
    if (USE_MIRROR && currentFacingMode === "user") {
      push();
      translate(width, 0);
      scale(-1, 1);
      image(capture, 0, 0, width, height);
      pop();
    } else {
      image(capture, 0, 0, width, height);
    }

    const hand = predictions.find(p =>
      p.label === 'open' || p.label === 'closed' || p.label === 'point'
    );

    if (hand) {
      const [bx, by, bw, bh] = hand.bbox;
      const centerX = bx + bw / 2;
      const centerY = by + bh / 2;

      const displayX = (USE_MIRROR && currentFacingMode === "user") ? (width - centerX) : centerX;
      const displayY = centerY;

      const offsetY = displayY - bh * 0.3;
      const size = Math.max(100, Math.min(480, (bw + bh) * 0.6));

      const ratio = bw / bh;
      let rot = 0;
      if (ratio > 1.2) rot = 20;
      else if (ratio < 0.8) rot = -20;

      mv.style.display = 'block';
      mv.style.left = `${Math.round(displayX)}px`;
      mv.style.top = `${Math.round(offsetY)}px`;
      mv.style.width = `${Math.round(size)}px`;
      mv.style.height = `${Math.round(size)}px`;
      mv.style.transform = `translate(-50%, -50%) rotate(${rot}deg)`;
    } else {
      mv.style.display = 'none';
    }
  }
</script>
