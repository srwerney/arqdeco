<!DOCTYPE html>
<html>
  <head>
    <title>Edifício Cauduro - AR.js</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/dist/mindar-image-aframe.prod.js"></script>
    <link rel="stylesheet" href="../../css/style.css" />
    <link rel="icon" href="../../assets/icones/favicon_Prancheta 1.png" type="image/x-icon">
    <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/"+i;
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script", "ti1ada77jq");
</script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
      
    </style>
  </head>
  <body>

   <div id="menunavtop">
  <a href="../../paginicial.html">
    <img class="group-icon" alt="" src="../../assets/icones/Group.svg">
  </a>
</div>

    <a-scene mindar-image="imageTargetSrc: ../../assets/target/targets.mind;" 
            vr-mode-ui="enabled: false" 
            device-orientation-permission-ui="enabled: true" 
            embedded>
      
      <a-camera mindar-image-camera look-controls="enabled: false"></a-camera>
      
      <a-entity mindar-image-target="targetIndex: 0">
        <a-plane color="red" opacity="1" position="0 0 0" height="0.552" width="1"></a-plane>
      </a-entity>

    </a-scene>


  <!-- BOTÃO SANDUÍCHE DO MENU INFERIOR -->
<div id="menuToggleBottom">
  <button id="toggleBtnBottom"><img src="../../assets/icones/menu.svg" style="width: 30px;"></button>
</div>

<!-- OVERLAY ESCURO DO MENU INFERIOR -->
<div id="menuOverlayBottom"></div>

<!-- MENU INFERIOR (ESCONDIDO INICIALMENTE) -->
<div id="menunavfooter">
  <a href="../../paginicial.html">
    <img src="../../assets/icones/home.svg" alt="Início">
    <span>Início</span>
  </a>
  <a href="../../sobre.html">
    <img src="../../assets/icones/hexagon.svg" alt="Sobre">
    <span>Sobre</span>
  </a>
  <a href="../../map.html">
    <img src="../../assets/icones/map.svg" alt="Mapa">
    <span>Mapa</span>
  </a>
  <a href="../../creditos.html">
    <img src="../../assets/icones/pen-tool.svg" alt="Creditos">
    <span>Curadoria</span>
  </a>
</div>

<script>
const toggleBtnBottom = document.getElementById("toggleBtnBottom");
const footerMenu = document.getElementById("menunavfooter");
const overlayBottom = document.getElementById("menuOverlayBottom");

toggleBtnBottom.addEventListener("click", () => {
  footerMenu.classList.toggle("active");
  overlayBottom.classList.toggle("active");
});

// Fecha ao clicar no overlay
overlayBottom.addEventListener("click", () => {
  footerMenu.classList.remove("active");
  overlayBottom.classList.remove("active");
});
</script>
  </body>
</html>
