<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR.js + A-Frame UFSM Parque Tecnológico</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>

    <!-- AR.js com suporte a localização -->
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/build/aframe-ar-nft.js"></script>
  </head>
  <body style="margin: 0; overflow: hidden;">

    <!-- Cena principal -->
    <a-scene 
      vr-mode-ui="enabled: false" 
      embedded 
      arjs="sourceType: webcam; trackingMethod: best; debugUIEnabled: false;"
      renderer="logarithmicDepthBuffer: true;"
    >

      <!-- Sistema de GPS -->
      <a-entity gps-camera rotation-reader></a-entity>

      <!-- Modelo 3D em coordenadas específicas -->
      <a-entity
        gps-entity-place="latitude: -29.724475688716204; longitude: -53.71321155674744"
        gltf-model="../assets/3d/jantzen.glb"
        scale="5 5 5"
      >
      </a-entity>

    </a-scene>
  </body>
</html>
