<script>
const PARTICLESIZE = 10;
const RESOLUTION = 10;
const MAX_FORCE = 50;
const MIN_FORCE = 0;

let imgUrl = 'assets/fotografia/16.png';
let img;
let particles = [];

function preload(){
    img = loadImage(imgUrl);
}

function setup() {
    createCanvas(windowWidth, windowHeight);
    spawnParticles();
}

function draw(){
    background(40);

    // calcula escala proporcional (cover)
    let scaleImg = max(width / img.width, height / img.height);
    let newW = img.width * scaleImg;
    let newH = img.height * scaleImg;

    // centraliza a imagem
    let offsetX = (width - newW) / 2;
    let offsetY = (height - newH) / 2;

    image(img, offsetX, offsetY, newW, newH);

    particles.forEach((particle) => {
      particle.update();
      particle.draw();
    });
}

function spawnParticles (){
    for (let i = 0; i < width; i+= RESOLUTION){
        for (let j=0; j < height; j += RESOLUTION){
          let x = i / width * img.width;
          let y = j / height * img.height;
          const color = img.get(int(x), int(y)); // usa coordenadas inteiras
          particles.push(new Particle(i + PARTICLESIZE / 2, j + PARTICLESIZE / 2, color));
        }
    }
}

class Particle{
    constructor(x, y, color){
      this.x = x;
      this.y = y;
      this.color = color;
      this.targetX = x;
      this.targetY = y;
    }

    update () {
      let mouseVector = createVector(mouseX, mouseY);
      let currentVector = createVector(this.x, this.y);
      let targetVector = createVector(this.targetX, this.targetY);

      let fromMouseToParticle = p5.Vector.sub(currentVector, mouseVector);
      let distanceToMouse = fromMouseToParticle.mag();

      let fromParticleToTarget = p5.Vector.sub(targetVector, currentVector);
      let distanceToTarget = fromParticleToTarget.mag();

      let totalForce = createVector(0, 0);

      if (distanceToMouse < 100){
        let repulsionForce = map(distanceToMouse, 0, 100, MAX_FORCE, MIN_FORCE);
        fromMouseToParticle.setMag(repulsionForce);
        totalForce.add(fromMouseToParticle);
      }

      if (distanceToTarget > 0){
        let attractionForce = map(distanceToTarget, 0, 100, MIN_FORCE, MAX_FORCE);
        fromParticleToTarget.setMag(attractionForce);
        totalForce.add(fromParticleToTarget);
      }

      this.x += totalForce.x;
      this.y += totalForce.y;
    }

    draw (){
      fill(this.color);
      noStroke();
      ellipse(this.x, this.y, PARTICLESIZE);
    }
}

// reajusta quando a janela mudar de tamanho
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  particles = [];
  spawnParticles();
}
</script>
